<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foglalás</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./base.js" defer></script>

</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">ArénaVPjegyek</a>
        </div>
        <div>
            <a href="base.html" class="btn btn-outline-light">Vissza a főoldalra</a>
        </div>
    </nav>
    <div class="container mt-5">
        <h1 class="mb-4">Foglalás</h1>
        <form action="foglalas_eredmeny.html" method="post">
            <div class="mb-3">
                <label for="nev" class="form-label">Név</label>
                <input type="text" class="form-control" id="nev" name="nev" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail cím</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="telefonszam" class="form-label">Telefonszám</label>
                <input type="tel" class="form-control" id="telefonszam" name="telefonszam" required>
            </div>
            <div class="mb-3">
                <label for="datum" class="form-label">Foglalás dátuma</label>
                <input type="date" class="form-control" id="datum" name="datum" required>
            </div>
        </form>
        <label for="tipus" class="form-label">Kedvezmény</label>
        <select id="tipus" name="tipus" class="form-select" required>
            <option value="">Nincs</option>
            <option>Gyerekjegy 15%</option>
            <option>Diákjegy 20%</option>
            <option>Nyugdíjasjegy 20%</option>
            <option>Csoportos jegy 15%</option>
        </select> <br><br><br>
        <button type="submit" class="btn btn-primary">Foglalás elküldése</button>
    </div>
    
</body>
