<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosár - ArénaVPjegyek</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./minden.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="base.html" class="nav-logo">ArénaVPjegyek</a>
        </div>
        <div>
            <a href="base.html" class="btn btn-outline-light">Vissza a főoldalra</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="mb-4">Kosár tartalma</h1>
        <div id="cartContent" class="card p-4 shadow-sm">
            <p>Még nincs elem a kosárban.</p>
        </div>
    </div>

    <!-- SIKERES FIZETÉS MODÁLIS ABLAK (Bootstrap) -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true" data-bs-backdrop="static">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light border-secondary">
          <div class="modal-header border-bottom border-secondary">
            <h5 class="modal-title text-success" id="successModalLabel">Sikeres tranzakció!</h5>
            <h6 class="modal-title text-success" id="successModalLabel">Jegyeit elküldtük a megadott e-mail címre!</h6>
          </div>
          <div class="modal-body text-center py-4">
            <div class="display-1 text-success mb-3">✔</div>
            <h4>Köszönjük a vásárlást!</h4>
            <p class="text-muted mt-2">A fizetés sikeresen megtörtént. A jegyeket és a foglalási részleteket elküldtük a megadott e-mail címre.</p>
          </div>
          <div class="modal-footer border-top border-secondary justify-content-center">
            <button type="button" id="modalCloseBtn" class="btn btn-success px-4">Vissza a főoldalra</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS Bundle (szükséges a modálhoz) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
       document.addEventListener('DOMContentLoaded', () => {
  const cartContent = document.getElementById('cartContent');
  const savedData = localStorage.getItem('kosar');

  if (!cartContent) return;

  if (!savedData) {
    cartContent.innerHTML = '<div class="alert alert-warning">A kosarad jelenleg üres!</div>';
    return;
  }

  const data = JSON.parse(savedData);

  // Kedvezmények listája az újraszámoláshoz
  const discounts = {
    'Gyerekjegy 15%': 0.15,
    'Diákjegy 20%': 0.20,
    'Nyugdíjasjegy 20%': 0.20,
    'Csoportos jegy 15%': 0.15
  };
  const STANDING_PRICE = 10000;
  const discountRate = discounts[data.kedvezmeny] || 0;
  const discountedStandingPrice = STANDING_PRICE * (1 - discountRate);

  // Ha korábbról csak szöveges végösszeg maradt volna, lekezeljük:
  if (typeof data.vegosszegSzam !== 'number') {
    data.vegosszegSzam = parseInt(String(data.vegosszeg || '').replace(/[^0-9]/g, '')) || 0;
  }

  function renderCart() {
    const hasSeats = data.helyek && data.helyek.length > 0;
    const standingCount = parseInt(data.allojegyekSzama) || 0;

    // Ha se ülőhely, se állójegy nem maradt benne
    if (!hasSeats && standingCount === 0) {
      localStorage.removeItem('kosar');
      cartContent.innerHTML = '<div class="alert alert-warning">A kosarad kiürült!</div>';
      return;
    }

    const formattedTotal = `${Math.round(data.vegosszegSzam).toLocaleString('hu-HU')} Ft`;

    cartContent.innerHTML = `
      <h3>Kiválasztott Koncert: <span class="text-primary">${data.koncert || 'Nincs megadva'}</span></h3>
      <hr>
      <p><strong>Név:</strong> ${data.nev}</p>
      <p><strong>E-mail:</strong> ${data.email}</p>
      <p><strong>Telefonszám:</strong> ${data.telefonszam}</p>
      <p><strong>Kiválasztott ülőhelyek:</strong> ${hasSeats ? data.helyek.join(', ') : 'Nincs'}</p>
      <p class="d-flex align-items-center">
        <strong>Állójegyek száma:</strong>
        <button id="btnDecreaseStanding" class="btn btn-sm btn-outline-secondary ms-2 me-1">-</button>
        <span class="badge bg-secondary fs-6">${standingCount} db</span>
        <button id="btnIncreaseStanding" class="btn btn-sm btn-outline-secondary ms-1">+</button>
      </p>
      <p><strong>Kedvezmény:</strong> ${data.kedvezmeny || 'Nincs'}</p>
      <h4 class="mt-3 text-success">Végösszeg: <span id="displayTotal">${formattedTotal}</span></h4>

      <div class="mt-4 d-flex justify-content-between align-items-center">
        <button id="clearCartBtn" class="btn btn-outline-danger">Kosár törlése</button>
        <button id="payBtn" class="btn btn-success btn-lg">Fizetés (${formattedTotal})</button>
      </div>
    `;

    // 1. Állójegy hozzáadása (+)
    document.getElementById('btnIncreaseStanding').addEventListener('click', () => {
      data.allojegyekSzama = (parseInt(data.allojegyekSzama) || 0) + 1;
      data.vegosszegSzam += discountedStandingPrice;

      localStorage.setItem('kosar', JSON.stringify(data));
      renderCart();
    });

    // 2. Állójegy csökkentése (-)
    document.getElementById('btnDecreaseStanding').addEventListener('click', () => {
      let currentCount = parseInt(data.allojegyekSzama) || 0;
      if (currentCount > 0) {
        data.allojegyekSzama = currentCount - 1;
        data.vegosszegSzam = Math.max(0, data.vegosszegSzam - discountedStandingPrice);

        localStorage.setItem('kosar', JSON.stringify(data));
        renderCart();
      }
    });

    // 3. Kosár azonnali ürítése
    document.getElementById('clearCartBtn').addEventListener('click', () => {
      if (confirm('Biztosan ki szeretnéd üríteni a kosarat?')) {
        localStorage.removeItem('kosar');
        cartContent.innerHTML = '<div class="alert alert-warning">A kosarad törölve lett.</div>';
      }
    });

    // 4. Fizetés indítása (spinner + modal)
    const payBtn = document.getElementById('payBtn');
    payBtn.addEventListener('click', () => {
      payBtn.disabled = true;
      payBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Banki átfutás...';

      setTimeout(() => {
        localStorage.removeItem('kosar');
        const modalEl = document.getElementById('successModal');
        if (modalEl) {
          const successModal = new bootstrap.Modal(modalEl);
          successModal.show();
        }
      }, 2000);
    });
  }

  renderCart();

  // Modál bezáró gomb visszairányítása
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  if (modalCloseBtn) {
    modalCloseBtn.addEventListener('click', () => {
      window.location.href = 'base.html';
    });
  }
});
    </script>
</body>
</html>
