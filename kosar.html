<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosár - ArénaVPjegyek</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./minden.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="base.html" class="nav-logo">ArénaVPjegyek</a>
        </div>
        <div>
            <a href="base.html" class="btn btn-outline-light">Vissza a főoldalra</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="mb-4">Kosár tartalma</h1>
        <div id="cartContent" class="card p-4 shadow-sm">
            <p>Még nincs elem a kosárban.</p>
        </div>
    </div>

    <!-- SIKERES FIZETÉS MODÁLIS ABLAK (Bootstrap) -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true" data-bs-backdrop="static">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light border-secondary">
          <div class="modal-header border-bottom border-secondary">
            <h5 class="modal-title text-success" id="successModalLabel">Sikeres tranzakció!</h5>
            <h6 class="modal-title text-success" id="successModalLabel">Jegyeit elküldtük a megadott e-mail címre!</h6>
          </div>
          <div class="modal-body text-center py-4">
            <div class="display-1 text-success mb-3">✔</div>
            <h4>Köszönjük a vásárlást!</h4>
            <p class="text-muted mt-2">A fizetés sikeresen megtörtént. A jegyeket és a foglalási részleteket elküldtük a megadott e-mail címre.</p>
          </div>
          <div class="modal-footer border-top border-secondary justify-content-center">
            <button type="button" id="modalCloseBtn" class="btn btn-success px-4">Vissza a főoldalra</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS Bundle (szükséges a modálhoz) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cartContent = document.getElementById('cartContent');
            const savedData = localStorage.getItem('kosar');

            if (savedData) {
                const data = JSON.parse(savedData);
                cartContent.innerHTML = `
                    <h3>Kiválasztott Koncert: <span class="text-primary">${data.koncert}</span></h3>
                    <hr>
                    <p><strong>Név:</strong> ${data.nev}</p>
                    <p><strong>E-mail:</strong> ${data.email}</p>
                    <p><strong>Telefonszám:</strong> ${data.telefonszam}</p>
                    <p><strong>Dátum:</strong> ${data.datum}</p>
                    <p><strong>Kiválasztott ülőhelyek:</strong> ${data.helyek.length > 0 ? data.helyek.join(', ') : 'Nincs'}</p>
                    <p><strong>Állójegyek száma:</strong> ${data.allojegyekSzama > 0 ? data.allojegyekSzama + ' db' : 'Nincs'}</p>
                    <p><strong>Kedvezmény:</strong> ${data.kedvezmeny}</p>
                    <h4 class="mt-3 text-success">Végösszeg: ${data.vegosszeg}</h4>
                    
                    <div class="mt-4 text-end">
                        <button id="payBtn" class="btn btn-success btn-lg">Fizetés szimulálása (${data.vegosszeg})</button>
                    </div>
                `;

                // Fizetés gomb eseménykezelője
                const payBtn = document.getElementById('payBtn');
                payBtn.addEventListener('click', () => {
                    payBtn.disabled = true;
                    payBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Banki kapcsolat...';

                    setTimeout(() => {
                        // Kosár ürítése a háttérben
                        localStorage.removeItem('kosar');

                        // Bootstrap Modál megjelenítése
                        const successModal = new bootstrap.Modal(document.getElementById('successModal'));
                        successModal.show();
                    }, 2000); // 2 mp "banki átfutás"
                });

                // Modál bezáró gomb -> irány a főoldal
                document.getElementById('modalCloseBtn').addEventListener('click', () => {
                    window.location.href = 'base.html';
                });
            }
        });
    </script>
</body>
</html>
